name: Build RoomEq v3

# CI du recodage TRIADE (adaptée de la CI v2.2.2 — décision D10) :
#   • tests xUnit sur les 3 OS (le code applicatif v3 est multiplateforme) ;
#   • packaging applicatif (publication win-x64 auto-contenue + zips) ;
#   • installateur Windows « 1 clic » RoomEq-win-Setup.exe (D20 — Velopack
#     cross-compilé Linux → win-x64, aucune dépendance applicative) ;
#   • greffon AudioUnit macOS (D19) + son installateur .pkg « 1 clic » (D20) ;
#   • greffon VST 2 32 bits Windows « RoomEq Correction » (D21 — cross-compilé
#     Linux → win32 avec Zig, cœur C++ du greffon AU) ;
#   • le pilote WDM et la DLL ASIO restent scellés v2.2.2 (décision D1,
#     natif/REFERENCE-NATIF.md) : ils s'installent via
#     RoomEqDriverSetup-2.2.2.exe, non recompilés ici.

on:
  push:
    branches: [main, v3-recodage]
    tags: ['v*']
  pull_request:
    branches: [main, v3-recodage]
  workflow_dispatch:

# « gh release » (zips) exige contents:write.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Tests (rapide) : xUnit sur les 3 OS.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Tests xUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (0 erreur 0 avertissement attendu)
        run: dotnet build src/RoomEq.sln -c Debug

      - name: Tests Core
        run: dotnet test tests/RoomEq.Core.Tests --no-build -c Debug

      - name: Tests Audio
        run: dotnet test tests/RoomEq.Audio.Tests --no-build -c Debug

      - name: Tests App
        run: dotnet test tests/RoomEq.App.Tests --no-build -c Debug

  # ─────────────────────────────────────────────────────────────────────
  # 2. Packaging applicatif : publish win-x64 + zips test/public/source.
  #    En CI, telemetrie.json réel est absent (ignoré par git) : le zip
  #    TEST embarque l'example sans identifiants — remplacer localement
  #    par le fichier réel pour une distribution de test.
  # ─────────────────────────────────────────────────────────────────────
  package:
    name: Packaging (win-x64 + zips)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Paquets (publish + zips + contrôles)
        run: |
          chmod +x scripts/package_v3.sh
          OUT="$PWD/artifacts" bash scripts/package_v3.sh

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-v3-zips-${{ github.sha }}
          path: artifacts/RoomEq-*.zip
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --draft --title "RoomEq $TAG" \
            --notes "Recodage TRIADE v3 (parité v2.2.2 — docs/PARITE-v2.2.2.md). Windows : RoomEq-win-Setup.exe = installation en 1 clic (raccourcis, désinstalleur, sans admin) ; alternative portable : lancez RoomEq.exe (public) ou RoomEq-test.exe (test). Le pilote et l'ASIO (scellés v2.2.2) s'installent via RoomEqDriverSetup-2.2.2.exe. macOS : RoomEq-AU-*-macos.pkg = greffon Ableton en 1 clic." \
            artifacts/RoomEq-*.zip || \
          gh release upload "$TAG" artifacts/RoomEq-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # 3. Greffon AudioUnit macOS (RoomEq.component — natif/roomeq-au,
  #    spec I-AUD-07 / N-AU-01) : tests natifs (parité RoomEq.Core),
  #    compilation, signature ad hoc, validation auval, artefact release.
  # ─────────────────────────────────────────────────────────────────────
  plugin-au:
    name: Greffon AU macOS (RoomEq.component)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cœur C++ + tests natifs (parité bit à bit avec RoomEq.Core)
        run: |
          # CMAKE_OSX_ARCHITECTURES via la ligne de commande : le set() du
          # CMakeLists (après project()/enable_language()) ne produit PAS de
          # binaire universel sur la CI — constaté v3.3.0/v3.6.0 (arm64 seul).
          # La variable de cache est consommée AVANT project(), garantie.
          cmake -S natif/roomeq-au -B build-core -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-core --parallel
          ./build-core/roomeq_au_tests natif/roomeq-au/tests/data

      - name: Compiler le greffon .component
        run: |
          cmake --build build-core --target RoomEqAU --parallel

      - name: Vérifier le bundle universel (arm64 + x86_64)
        run: |
          # VERROU (même philosophie que le correctif ABI VST v3.5.2) : la
          # promesse « bundle universel » du README doit être prouvée par la
          # CI — un binaire mono-architecture (Mac Intel exclu silencieusement)
          # échoue la livraison.
          ARCHS=$(lipo -archs build-core/RoomEq.component/Contents/MacOS/RoomEq)
          echo "Architectures du greffon : $ARCHS"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64
          echo "Bundle universel confirmé."

      - name: Signature ad hoc
        run: |
          codesign --force --sign - build-core/RoomEq.component
          codesign --verify --verbose=2 build-core/RoomEq.component

      - name: Validation auval (outil officiel d'Apple)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/RoomEq.component
          cp -R build-core/RoomEq.component ~/Library/Audio/Plug-Ins/Components/
          xattr -cr ~/Library/Audio/Plug-Ins/Components/RoomEq.component || true
          # diagnostic : structure du bundle et plist (en cas d'échec auval)
          ls -la ~/Library/Audio/Plug-Ins/Components/RoomEq.component/Contents/
          plutil -lint ~/Library/Audio/Plug-Ins/Components/RoomEq.component/Contents/Info.plist
          # forcer le re-scan immédiat de la base des composants (le registrar
          # tourne en tâche de fond avec un délai) avant de valider
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Rmeq Rmeq

      - name: Empaqueter l'artefact
        run: |
          mkdir -p artifacts
          VERSION=$(sed -n 's/^project(RoomEqAU VERSION \([0-9.]*\).*/\1/p' natif/roomeq-au/CMakeLists.txt)
          ditto -c -k --keepParent build-core/RoomEq.component \
            "artifacts/RoomEq-AU-${VERSION}-macos.zip"
          cp natif/roomeq-au/README.md artifacts/RoomEq-AU-LISEZMOI.md
          ls -la artifacts/

      - name: Installateur .pkg « 1 clic » (D20)
        run: |
          VERSION=$(sed -n 's/^project(RoomEqAU VERSION \([0-9.]*\).*/\1/p' natif/roomeq-au/CMakeLists.txt)
          PKGROOT="$(mktemp -d)"
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/Components"
          cp -R build-core/RoomEq.component "$PKGROOT/Library/Audio/Plug-Ins/Components/"
          # postinstall : retirer la quarantaine éventuelle et forcer le
          # re-scan immédiat de la base des composants (recette auval, D19)
          mkdir -p pkg-scripts
          printf '%s\n' '#!/bin/bash' \
            'xattr -cr "/Library/Audio/Plug-Ins/Components/RoomEq.component" 2>/dev/null || true' \
            'killall AudioComponentRegistrar 2>/dev/null || true' \
            'exit 0' > pkg-scripts/postinstall
          chmod +x pkg-scripts/postinstall
          pkgbuild --root "$PKGROOT" \
            --identifier fr.roomeq.RoomEqAU.pkg \
            --version "$VERSION" \
            --scripts pkg-scripts \
            "artifacts/RoomEq-AU-${VERSION}-macos.pkg"
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-au-component-${{ github.sha }}
          path: artifacts/RoomEq-AU-*
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # le job « package » crée la release : attendre qu'elle existe pour
          # ne créer qu'UNE seule draft (créations parallèles = doublon) ;
          # repli en création si elle n'apparaît pas
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/RoomEq-AU-* --clobber
          else
            gh release create "$TAG" --draft --title "RoomEq $TAG" \
              --notes "Recodage TRIADE v3 (parité v2.2.2 — docs/PARITE-v2.2.2.md)." \
              artifacts/RoomEq-AU-*
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # 4. Installateur Windows « 1 clic » (D20 — Velopack, cross-compilé
  #    Linux → win-x64) : RoomEq-win-Setup.exe. Double-clic → installé :
  #    raccourcis Bureau + Menu démarrer, désinstalleur, installation
  #    utilisateur SANS admin (%LOCALAPPDATA%\RoomEq). Aucune dépendance
  #    ajoutée à l'application (--skipVeloAppCheck — mises à jour auto =
  #    décision future). Le nupkg reste un artefact CI, non joint.
  # ─────────────────────────────────────────────────────────────────────
  setup:
    name: Installateur Windows 1 clic (Setup.exe)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Produire RoomEq-win-Setup.exe (publish + Velopack + contrôles)
        run: |
          chmod +x scripts/build_setup.sh
          OUT="$PWD/artifacts" bash scripts/build_setup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-v3-setup-${{ github.sha }}
          path: artifacts/RoomEq-win-Setup.exe
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # le job « package » crée la release : attendre qu'elle existe pour
          # ne créer qu'UNE seule draft (créations parallèles = doublon) ;
          # repli en création si elle n'apparaît pas
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/RoomEq-win-Setup.exe --clobber
          else
            gh release create "$TAG" --draft --title "RoomEq $TAG" \
              --notes "Recodage TRIADE v3 (parité v2.2.2 — docs/PARITE-v2.2.2.md)." \
              artifacts/RoomEq-win-Setup.exe
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Greffon VST 2 32 bits Windows (D21) : RoomEq.dll — même cœur C++
  #    que le greffon AU, cross-compilé Linux → win32 avec Zig 0.14.1
  #    (SSE2 forcé), ABI VST 2 autodéclarée (aucune dépendance tierce).
  # ───────────────────────────────────────────────────────────────────────────
  plugin-vst:
    name: Greffon VST 2 32 bits (RoomEq.dll win32)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - name: "Cœur C++ + tests natifs + mini-hôte (parité bit à bit)"
        run: |
          cmake -S natif/roomeq-vst -B build-vst -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vst --parallel
          ./build-vst/roomeq_vst_tests natif/roomeq-au/tests/data
          ./build-vst/roomeq_vst_host build-vst/RoomEqVst.so \
            natif/roomeq-au/tests/data

      - name: "Compiler RoomEq.dll (32 bits, Zig 0.14.1 épinglé)"
        run: |
          curl -sL --retry 3 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          tar -xJ -C /tmp -f /tmp/zig.tar.xz
          ZIG=/tmp/zig-x86_64-linux-0.14.1/zig bash natif/roomeq-vst/build-vst.sh
          mkdir -p artifacts
          cp natif/roomeq-vst/dist/RoomEq-VST-* artifacts/
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-vst-win32-${{ github.sha }}
          path: artifacts/RoomEq-VST-*
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # le job « package » crée la release : attendre qu'elle existe pour
          # ne créer qu'UNE seule draft (créations parallèles = doublon) ;
          # repli en création si elle n'apparaît pas
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/RoomEq-VST-* --clobber
          else
            gh release create "$TAG" --draft --title "RoomEq $TAG" \
              --notes "Recodage TRIADE v3 (parité v2.2.2 — docs/PARITE-v2.2.2.md)." \
              artifacts/RoomEq-VST-*
          fi
        env:
          GH_TOKEN: ${{ github.token }}
