name: Build RoomEq

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# « gh release » (macos + msi) exige contents:write — sans ce bloc, le
# GITHUB_TOKEN par défaut est en lecture seule (HTTP 403 « Resource not
# accessible by integration »).
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Tests (rapide) : xUnit sur les 3 OS — le pont ASIO et le greffon
  #    partagent des chemins multiplateformes vérifiés partout.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Tests xUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Noyau du pont ASIO (g++, Linux)
        if: runner.os == 'Linux'
        run: make -C asio/bridge_core test

      - name: Build
        run: dotnet build RoomEq.sln -c Debug

      - name: Tests Core
        run: dotnet test tests/RoomEq.Core.Tests --no-build -c Debug

      - name: Tests Audio
        run: dotnet test tests/RoomEq.Audio.Tests --no-build -c Debug

  # ─────────────────────────────────────────────────────────────────────
  # 2. Pilote WDM (roomeqvad) + DLL ASIO — Windows + WDK.
  #    Produit un paquet pilote SIGNÉ-TEST (certificat de la CI exporté à
  #    côté : pour une distribution propre, voir INSTALLATION-PILOTE.md).
  # ─────────────────────────────────────────────────────────────────────
  driver:
    name: Pilote + ASIO (WDK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: WDK via NuGet + build + inf2cat + signature de test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File driver\roomeqvad\build\build_driver.ps1 -Configuration Release -TestSign

      - name: Compiler la DLL ASIO (MSVC, sans WDK)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                        -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          # v143 absent de l'image VS2026 (v142 + toolset par défaut présents)
          & $msbuild asio\asiodll\RoomEqAsio.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142 /m /v:m
          if ($LASTEXITCODE -ne 0) { throw "build ASIO échoué ($LASTEXITCODE)" }

      - name: Rassembler l'artefact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\driver | Out-Null
          Copy-Item driver\roomeqvad\build\x64\* artifact\driver\ -ErrorAction SilentlyContinue
          Copy-Item -ErrorAction SilentlyContinue `
            (Get-ChildItem asio\asiodll -Recurse -Filter RoomEqAsio64.dll | Select-Object -First 1).FullName `
            artifact\RoomEqAsio64.dll
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-driver-${{ github.sha }}
          path: artifact/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # 3b. macOS : application Avalonia + greffon RoomEqHAL (AudioServerPlugIn)
  #      + paquet .pkg (arm64 + x86_64). Signature ad-hoc : pour la
  #      distribution, Developer ID + notarisation (INSTALLATION-MACOS.md).
  # ─────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (app + greffon + pkg)
    runs-on: macos-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilation + tests macOS
        run: |
          dotnet build RoomEq.sln -c Release
          dotnet test tests/RoomEq.Core.Tests --no-build -c Release
          dotnet test tests/RoomEq.Audio.Tests --no-build -c Release

      - name: Paquets macOS (app + greffon + pkg, arm64 et x64)
        run: bash installer/macos/build_pkg.sh both

      - name: Vérifier les paquets
        run: |
          ls -la installer/macos/build/*.pkg
          pkgutil --check-signature installer/macos/build/*.pkg || true

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-macos-${{ github.sha }}
          path: installer/macos/build/*.pkg
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --draft --title "RoomEq $TAG" --notes "Installation : exécuter le .pkg (administrateur). Voir INSTALLATION-MACOS.md." installer/macos/build/*.pkg || \
          gh release upload "$TAG" installer/macos/build/*.pkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # 3. MSI complet : application + pilote CI + ASIO + installateur WiX.
  # ─────────────────────────────────────────────────────────────────────
  msi:
    name: Installateur MSI
    runs-on: windows-latest
    needs: [tests, driver]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Récupérer l'artefact pilote + ASIO
        uses: actions/download-artifact@v4
        with:
          name: roomeq-driver-${{ github.sha }}
          path: ci-driver

      - name: Lire la version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer WiX 6 + extension UI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          # Version PINNÉE 6.0.2 : sans version, NuGet résout 7.0.0 —
          # incompatible avec wix 6 (WIX6101 « expected package root folder
          # wixext6 »).
          wix extension add -g WixToolset.UI.wixext/6.0.2

      - name: Assembler le MSI
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build_msi.ps1 `
            -DriverDir ci-driver\driver `
            -AsioDll ci-driver\RoomEqAsio64.dll
        env:
          # python est préinstallé sur les runners ; le générateur en a besoin
          PYTHON: python

      - name: Vérifier le MSI
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $msi = "installer\build\RoomEq-$v-win-x64.msi"
          if (-not (Test-Path $msi)) { throw "MSI introuvable : $msi" }
          Get-Item $msi | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-msi-${{ github.sha }}
          path: installer/build/RoomEq-*.msi
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          # pwsh n'étend PAS les jokers entre guillemets et gh non plus :
          # résoudre le chemin explicitement.
          $msi = Get-Item 'installer\build\RoomEq-*.msi' | Select-Object -First 1
          if (-not $msi) { throw "MSI introuvable pour la publication" }
          gh release create "$tag" --draft --title "RoomEq $tag" --notes "Installation : double-cliquez sur le MSI et acceptez l'invite administrateur — tout est automatique (application, carte son virtuelle avec certificat + mode test + périphérique, pilote ASIO). Un redémarrage est proposé si le mode test vient d'être activé. Le pilote est signé-test : voir INSTALLATION-PILOTE.md." "$($msi.FullName)" || `
          gh release upload "$tag" "$($msi.FullName)" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # 3b. Executables « sans MSI » : application portable (fichier unique)
  #      + version INSTALLABLE de l'application (RoomEqAppSetup : demarrage
  #      automatique Windows, sans UAC) + setup pilote autonome (fichiers
  #      pilote embarques). Contourne toute la chaine msiexec/Windows
  #      Installer (demande utilisateur apres blocages CFA).
  # ─────────────────────────────────────────────────────────────────────
  exes:
    name: Executables (app portable/setup + pilote)
    runs-on: windows-latest
    needs: [tests, driver]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Récupérer l'artefact pilote + ASIO
        uses: actions/download-artifact@v4
        with:
          name: roomeq-driver-${{ github.sha }}
          path: ci-driver

      - name: Assembler les 3 executables
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build_exes.ps1 `
            -DriverDir ci-driver\driver `
            -AsioDll ci-driver\RoomEqAsio64.dll

      - name: Vérifier les executables
        shell: pwsh
        run: |
          $exe1 = Get-Item 'installer\build\RoomEq-*-win-x64.exe' | Select-Object -First 1
          $exe2 = Get-Item 'installer\build\RoomEqDriverSetup-*.exe' | Select-Object -First 1
          $exe3 = Get-Item 'installer\build\RoomEqAppSetup-*.exe' | Select-Object -First 1
          if (-not $exe1 -or -not $exe2 -or -not $exe3) { throw 'Un des executables est introuvable' }
          Get-Item $exe1.FullName, $exe2.FullName, $exe3.FullName | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-exes-${{ github.sha }}
          path: |
            installer/build/RoomEq-*-win-x64.exe
            installer/build/RoomEqDriverSetup-*.exe
            installer/build/RoomEqAppSetup-*.exe
          if-no-files-found: error

      - name: Joindre au tag (Release) si présent
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $exe1 = Get-Item 'installer\build\RoomEq-*-win-x64.exe' | Select-Object -First 1
          $exe2 = Get-Item 'installer\build\RoomEqDriverSetup-*.exe' | Select-Object -First 1
          $exe3 = Get-Item 'installer\build\RoomEqAppSetup-*.exe' | Select-Object -First 1
          if (-not $exe1 -or -not $exe2 -or -not $exe3) { throw 'Executables introuvables pour la publication' }
          gh release create "$tag" --draft --title "RoomEq $tag" --notes "Distribution executables (sans MSI) : application au choix PORTABLE (aucune installation) ou INSTALLABLE (RoomEqAppSetup : raccourcis + demarrage automatique Windows, sans UAC), puis RoomEqDriverSetup (pilote + ASIO, une invite UAC). Voir INSTALLATION-PILOTE.md." "$($exe1.FullName)" "$($exe2.FullName)" "$($exe3.FullName)" || `
          gh release upload "$tag" "$($exe1.FullName)" "$($exe2.FullName)" "$($exe3.FullName)" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # 4. MSIX Store : scaffolding v2.1.0 (docs/SIGNATURE-ET-STORE.md).
  #    Paquet NON signé (la soumission Store est re-signée par Microsoft) ;
  #    pilote embarqué en donnée pour l'activation au premier lancement.
  # ─────────────────────────────────────────────────────────────────────
  msix:
    name: Paquet MSIX (Store)
    runs-on: windows-latest
    needs: [tests, driver]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Récupérer l'artefact pilote + ASIO
        uses: actions/download-artifact@v4
        with:
          name: roomeq-driver-${{ github.sha }}
          path: ci-driver

      - name: Assembler le MSIX
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer\msix\build_msix.ps1 `
            -DriverDir ci-driver\driver `
            -AsioDll ci-driver\RoomEqAsio64.dll

      - name: Vérifier le MSIX
        shell: pwsh
        run: |
          $msix = Get-Item 'installer\msix\build\RoomEq-*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'MSIX introuvable' }
          Get-Item $msix.FullName | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: roomeq-msix-${{ github.sha }}
          path: installer/msix/build/RoomEq-*.msix
          if-no-files-found: error
